
<div class="row mt-4">
    <div class="col-3">
        <h2 class="addTitle">Add New Class</h2>
    </div>
    <div class="col-9 d-flex">
        <input type="text" class="form-control formInput" [(ngModel)]="className">
        <button class="btn btn-info" (click)="submitClassName()">ADD</button>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-12">
            <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Class</th>
                    <th scope="col">Edit</th>
                    <th scope="col">Delete</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of classData">
                    <td>{{item.class_id}}</td>
                    <td>
                        <span *ngIf="!item.isUpdate">{{item.class_name}}</span>
                        <span *ngIf="item.isUpdate"><input type="text" class="form-control"  [(ngModel)]="updatedClassName"></span>
                    </td>
                    <td>
                        
                        <span  *ngIf="!item.isUpdate"><i class="bi bi-pencil-fill" (click)="triggerEdit(item)"></i></span>
                        <span  *ngIf="item.isUpdate"><button (click)="updateClassName(item.class_id,item)" class="btn btn-secondary">Submit</button></span>
                    </td>
                    <td><span (click)="deleteClass(item.class_id)"><i class="bi bi-trash3-fill"></i></span></td>
                  </tr>
                  
                </tbody>
              </table>
        </div>
    </div>
</div>
